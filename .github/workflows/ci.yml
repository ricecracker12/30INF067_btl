name: ci
on:
  push:
    # loveart1210: nhanh lam viec, bat CI de biet do/xanh truoc khi mo PR thay vi doi toi luc do.
    # Go ten nhanh nay ra khi nhanh duoc merge va xoa.
    # Sua trigger tren CHINH nhanh do la du: voi su kien push, GitHub dung file workflow cua commit
    # duoc push, khong phai ban tren nhanh mac dinh.
    branches: [main, develop, loveart1210]
  pull_request:
    branches: [main, develop]

# Khi da mo PR loveart1210 -> develop, mot lan push kich hoat CA push LAN pull_request tren cung mot
# commit. Nhom theo ref + huy lan chay cu de khong ton 2 lan chay va khong phai doc 2 ket qua.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CONG LANE FE: template Next.js tu chay `git init`, de sot src/frontend/.git thi `git add` ghi
      # mot GITLINK (mode 160000) thay vi file. Clone/checkout ra thu muc RONG, nen moi buoc
      # lint/typecheck/build cua FE chay tren hu khong ma van xanh. Kiem thang vao mode thay vi dem
      # file: dem file se do oan tren nhanh chua co lane FE.
      - name: Khong co repo Git long trong src/ (CI GATE)
        run: |
          if git ls-files -s src | grep -q '^160000'; then
            echo "::error::Co gitlink trong src/ -- xoa .git long (vd src/frontend/.git) roi git add lai"
            git ls-files -s src | grep '^160000'
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SocialApp.sln
      - name: Build
        run: dotnet build SocialApp.sln -c Release --no-restore
      - name: Test (unit + integration)
        run: dotnet test SocialApp.sln -c Release --no-build --filter "Category!=AuthZ&Category!=Contract" --verbosity normal

      # CONG HOP DONG API: file Modules/<Module>/Presentation/<nhom>.yaml phai khop
      # /swagger/<nhom>/swagger.json sinh tu code. Tach rieng de log chi thang vao "hop dong lech"
      # thay vi lan trong hang tram test khac. Day la thu THAY CHO viec doi chieu Swagger voi stub
      # bang mat o cong dong GD1 (docs/giai-doan-1/giai-doan-1.md Muc 11).
      #
      # NHAM VAO PROJECT, KHONG NHAM VAO .sln -- day la dieu kien de cai cong nay dung duoc:
      # TreatNoTestsAsError xet RIENG TUNG test assembly. Chay tren .sln thi UnitTests.dll va
      # ArchitectureTests.dll khong co test nao mang trait Contract, moi assembly do tra exit 1 va
      # buoc nay do DU hop dong hoan toan khop. Da dinh dung loi do mot lan.
      # Gioi han vao project giu duoc y nghia that cua co: go sai trait / doi ten Category thi
      # IntegrationTests chay 0 test -> cong DO, dung nhu mong muon.
      # Them module moi ma test hop dong nam o project khac: them mot buoc nua o day, dung go co.
      - name: API contract (CI GATE)
        run: dotnet test tests/SocialApp.IntegrationTests/SocialApp.IntegrationTests.csproj -c Release --no-build --filter "Category=Contract" -- RunConfiguration.TreatNoTestsAsError=true

      # CI GATE (GOAL-03, Muc 10.2): tach rieng de log chi thang nguyen nhan fail, fail la chan merge.
      # Test AuthZ nam o IntegrationTests (AuthZ/AuthZMatrixTests.cs), chay tren Postgres that da seed.
      # NHAM VAO PROJECT kem TreatNoTestsAsError, giong cong hop dong o tren: go sai trait -> 0 test ->
      # buoc nay DO, thay vi xanh voi 0 test ma khong ai biet (da thu mot lan cho do, xem PR khoi B).
      # DUNG chay tren .sln voi co nay: co xet rieng tung assembly, UnitTests/ArchitectureTests khong co
      # test AuthZ se lam buoc nay do du AuthZ hoan toan dung.
      - name: AuthZ matrix (CI GATE)
        run: dotnet test tests/SocialApp.IntegrationTests/SocialApp.IntegrationTests.csproj -c Release --no-build --filter "Category=AuthZ" -- RunConfiguration.TreatNoTestsAsError=true

  # Lane FE chay SONG SONG voi job .NET o tren: khong cong vao thoi gian cua no (NFR: CI <= 10 phut).
  # Playwright KHONG o day o GD1 -- can API + Postgres + Redis + Mailpit chay that; chay local, ket
  # qua dan vao PR (Đ-E8).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4          # doc phien ban tu "packageManager" trong src/frontend/package.json
        with:
          package_json_file: src/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # CONG CODEGEN: schema.d.ts commit trong repo phai khop identity-v1.yaml hien tai.
      # Doi hop dong ma quen `pnpm gen:api` -> file sinh lech -> DO. Doi version openapi-typescript
      # cung do: dung y, vi doi version la doi file sinh ra.
      #
      # DUNG `git status --porcelain`, KHONG dung `git diff --exit-code`: `git diff` chi so index voi
      # worktree nen no IM LANG voi file chua commit. Da dinh dung cai bay do mot lan luc thu cho do
      # o E2 -- hop dong hong ma cong van xanh, vi schema.d.ts luc ay con untracked. `status` bat ca
      # hai: file bi sua (` M`) lan file chua vao repo (`??`).
      - name: API types khop hop dong (CI GATE)
        run: |
          pnpm gen:api
          changed=$(git status --porcelain -- lib/api/schema.d.ts)
          if [ -n "$changed" ]; then
            echo "::error::lib/api/schema.d.ts lech hop dong hoac chua duoc commit -- chay 'pnpm gen:api' roi commit file sinh ra"
            echo "$changed"
            git diff -- lib/api/schema.d.ts
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Duong dan tuong doi: staging cung origin voi apache (Đ-E1). Thieu bien nay thi build
      # production nem loi neu bat ky module nao cham lib/api/config.ts.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1

      # CONG BUNDLE: bundle production KHONG duoc chua MSW, cung khong duoc chua URL API dev.
      # Tu 2026-09-17 app khong con mock trinh duyet (doi D-E7) -- MSW chi o Vitest. Cong giu lai lam
      # luoi an toan: service worker MSW hoac base URL dev lot vao ban build staging thi do.
      - name: Bundle production sach MSW (CI GATE)
        run: |
          hits=$(grep -rlE "mockServiceWorker|setupWorker|localhost:5259" .next/static || true)
          if [ -n "$hits" ]; then
            echo "::error::MSW hoac URL API dev lot vao bundle production"
            echo "$hits"
            exit 1
          fi
