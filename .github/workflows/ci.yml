name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SocialApp.sln
      - name: Build
        run: dotnet build SocialApp.sln -c Release --no-restore
      - name: Test (unit + integration)
        run: dotnet test SocialApp.sln -c Release --no-build --filter "Category!=AuthZ&Category!=Contract" --verbosity normal

      # CONG HOP DONG API: file Modules/<Module>/Presentation/<nhom>.yaml phai khop
      # /swagger/<nhom>/swagger.json sinh tu code. Tach rieng de log chi thang vao "hop dong lech"
      # thay vi lan trong hang tram test khac. Day la thu THAY CHO viec doi chieu Swagger voi stub
      # bang mat o cong dong GD1 (docs/giai-doan-1.md Muc 11).
      - name: API contract (CI GATE)
        run: dotnet test SocialApp.sln -c Release --no-build --filter "Category=Contract" -- RunConfiguration.TreatNoTestsAsError=true

      # CI GATE (GOAL-03, Muc 10.2): tach rieng de log chi thang nguyen nhan fail, fail la chan merge.
      # Chua co test nao mang trait Category=AuthZ nen buoc nay dang xanh (dotnet test tra 0 khi
      # filter khong khop). Khoi B GD1 them TC-A01/TC-A02.
      # NGAY KHI co test AuthZ dau tien, them vao cuoi lenh:
      #     -- RunConfiguration.TreatNoTestsAsError=true
      # neu khong, go sai trait se lam cong chan xanh voi 0 test ma khong ai biet.
      - name: AuthZ matrix (CI GATE)
        run: dotnet test SocialApp.sln -c Release --no-build --filter "Category=AuthZ"
