name: deploy-staging
on:
  push:
    branches: [develop]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ricecracker12/30inf067_btl/api:staging
            ghcr.io/ricecracker12/30inf067_btl/api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: src/frontend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ricecracker12/30inf067_btl/frontend:staging
            ghcr.io/ricecracker12/30inf067_btl/frontend:${{ github.sha }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose trên VPS không nằm trong image — sync từ repo trước khi pull/up (F1).
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: deploy/docker-compose.staging.apache.yml
          target: app/deploy/
          strip_components: 1
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e                                   # deploy hỏng thì CD phải ĐỎ (trước đây prune -f ở cuối che mất lỗi)
            cd ~/app/deploy
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.staging.apache.yml pull
            docker compose -f docker-compose.staging.apache.yml run --rm migrate
            docker compose -f docker-compose.staging.apache.yml up -d --remove-orphans
            docker image prune -f
