# Hạ tầng dev cục bộ (GĐ0). Chạy từ gốc repo:
#   docker compose -f deploy/docker-compose.dev.yml up -d --build
# Mật khẩu Postgres lấy từ deploy/.env (gitignore) — chưa có thì chép deploy/.env.example rồi ĐIỀN
# POSTGRES_PASSWORD. Cố ý không có default inline: thiếu thì compose từ chối chạy, thay vì lặng lẽ dùng
# một mật khẩu ai đọc repo cũng biết. Code chạy trên máy host (dotnet run, dotnet ef) đọc cùng biến từ
# cùng file (SharedKernel/Configuration/DevEnvFile.cs).
name: socialapp-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialapp
      POSTGRES_USER: socialapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong deploy/.env (chép từ deploy/.env.example)}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialapp -d socialapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit: SMTP giả cho luồng xác minh email (dev). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=socialapp;Username=socialapp;Password=${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong deploy/.env (chép từ deploy/.env.example)}"
      ConnectionStrings__Redis: "redis:6379"
      # Khóa ký JWT (C4): thiếu thì api từ chối khởi động. Cùng deploy/.env, cùng tinh thần POSTGRES_PASSWORD.
      # Issuer/Audience lấy từ appsettings.json trong image.
      Jwt__SigningKey: "${Jwt__SigningKey:?Đặt Jwt__SigningKey trong deploy/.env (openssl rand -base64 48)}"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
