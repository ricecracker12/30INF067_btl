# ---------------------------------------------------------------------------------------------
# HỢP ĐỒNG API — nhóm quản trị của module Identity, v1 (GĐ6 · UC-20)
#
# Nhóm Swagger THỨ HAI của Identity (docs/giai-doan-6/giai-doan-6.md Đ-6.1, Mục 8.2): quản trị tài
# khoản và vai trò ở Identity vì mọi thứ các endpoint này ghi — users.status, users.role_id, roles,
# role_permissions, refresh_tokens — là bảng của Identity. Tên nhóm `admin-v1` khớp ba chỗ:
# `AdminApiGroup.Name`, dòng `apiGroups` ở Program.cs, tên file này.
#
# CÓ MÁY CANH: `AdminContractTests` so file này với /swagger/admin-v1/swagger.json sinh từ code —
# lệch tập (path × method), tập status code, hoặc required field của request body là CI đỏ.
# `ContractGateCoverageTests` canh file này có dòng `Content Include` + lớp so.
#
# LỚN DẦN THEO ĐẦU VIỆC CỦA KHỐI D (luật "hợp đồng đi cùng controller", chốt 2026-09-24): mỗi
# operation vào file này TRONG CÙNG COMMIT với controller hiện thực nó — không có operation nào
# nằm đây trước code.
#   D2 (2026-09-24): GET /admin/users, GET /admin/users/{userId}.
#   D3: POST …/lock, …/unlock · D4: PUT …/role · D5: /admin/roles*, GET /admin/permissions.
#
# QUYẾT ĐỊNH ĐỨNG SAU (giai-doan-6.md):
#   Đ-6.8   Mọi endpoint ở đây FAIL-CLOSED: không kiểm được thu hồi token (Redis chết) → 503
#           `urn:socialapp:problem:revocation-unavailable`, không fail-open như phần còn lại.
#   Đ-6.15  Tầng 2 từ chối → 403 + một dòng audit `access.denied` (tối đa một dòng/phút/người/route).
#   Mục 6.1 Danh sách + chi tiết tài khoản: policy ANY-OF `user.lock` | `user.unlock` | `role.assign`.
#   Mục 8.2 `email` là PII — chỉ trả ở nhóm này, không bao giờ vào log.
# ---------------------------------------------------------------------------------------------
openapi: 3.0.3

info:
  title: SocialApp — Admin API
  version: 1.0.0-gd6
  description: |
    Màn quản trị của GĐ6 (UC-20): tài khoản, vai trò, quyền. Chỉ người có quyền quản trị gọi được —
    người dùng thường nhận **403** (dòng `TC-A05` của AuthZ matrix).

    ### Ba điều mọi endpoint ở đây có chung

    | | |
    |---|---|
    | **Fail-closed** (Đ-6.8) | Server không kiểm được token có bị thu hồi không (Redis không trả lời) → **503** `type` `urn:socialapp:problem:revocation-unavailable`. FE hiện "Chức năng quản trị tạm thời không khả dụng", **không** đăng xuất người dùng. Phần còn lại của app vẫn chạy |
    | **Audit khi bị từ chối** (Đ-6.15) | 403 của tầng 2 để lại một dòng `access.denied` trong nhật ký kiểm toán |
    | **Không optimistic** (Đ-6.21) | Màn quản trị vẽ lại theo response, không đoán trước kết quả |

    ### Lỗi

    Mọi lỗi trả **RFC 7807 Problem Details** (`application/problem+json`) kèm `traceId` — bằng đúng
    giá trị header `X-Correlation-ID` của chính request đó. 503 phân nhánh theo **`type`**, không
    theo `title`.

    ### Rate limit

    100 req/phút theo user (hạn mức chung). Vượt → `429`.
  contact:
    name: Nhóm 4 — 30INF067

servers:
  - url: http://localhost:5259/api/v1
    description: Dev — backend chạy local (`dotnet run`)
  - url: https://mxh.banhgao.net/api/v1
    description: Staging

tags:
  - name: admin-users
    description: Tài khoản — danh sách, chi tiết (UC-20).

paths:

  /admin/users:
    get:
      tags: [admin-users]
      operationId: listAdminUsers
      summary: Danh sách tài khoản, mới tạo trước
      description: |
        Tầng 2: **bất kỳ một** trong `user.lock`, `user.unlock`, `role.assign` (policy any-of, Mục 6.1) — người chỉ có
        `role.assign` cũng phải xem được danh sách để chọn người gán vai trò. `ADMIN` qua mọi mã (lối tắt tầng 2).

        Sắp `created_at DESC`, hòa thì `user_id DESC`. Cursor opaque — FE chỉ chuyển tiếp `nextCursor`, không tự dựng.
        Hết dữ liệu khi `nextCursor` là `null`, không suy từ độ dài `items`.

        Bộ lọc kết hợp bằng AND. `roleCode` đúng dạng mà không tồn tại → trang rỗng, không 400 (vai trò là dữ liệu từ GĐ6).
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: |
            **Tiền tố** email, không phân biệt hoa thường (cột `citext`). `%`, `_` và `\` hiểu theo **nghĩa đen** — `a_`
            không khớp `ab@…`. Không cắt khoảng trắng. Tối đa 254 ký tự → quá thì 400 `errors.q`.
          schema:
            type: string
            maxLength: 254
          example: an.nguyen
        - name: status
          in: query
          required: false
          description: Chỉ tài khoản ở trạng thái này. Giá trị khác hai giá trị dưới → 400 `errors.status`.
          schema:
            type: string
            enum: [active, disabled]
        - name: roleCode
          in: query
          required: false
          description: Chỉ tài khoản có vai trò này (`roles.code`). Sai dạng `RoleCode` → 400 `errors.roleCode`.
          schema:
            $ref: '#/components/schemas/RoleCode'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Một trang tài khoản.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
              example:
                items:
                  - userId: 0192f3c1-8a4e-7c31-9f2a-6b5d4e3c2a10
                    email: an.nguyen@example.com
                    displayName: Nguyễn Văn An
                    roleCode: USER
                    roleDisplayName: Người dùng
                    status: active
                    emailVerified: true
                    lockedUntil: null
                    createdAt: '2026-09-08T03:10:22Z'
                nextCursor: MjAyNi0wOS0wOFQwMzoxMDoyMi4wMDAwMDAwKzAwOjAwfDAxOTJmM2MxLThhNGUtN2MzMS05ZjJhLTZiNWQ0ZTNjMmExMA
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RevocationUnavailable'

  /admin/users/{userId}:
    get:
      tags: [admin-users]
      operationId: getAdminUser
      summary: Một tài khoản
      description: |
        Cùng tầng 2 với danh sách. `userId` là **đích**; người thao tác luôn là chủ token. Không tồn tại → **404** — endpoint
        đặc quyền nên 404 không lộ gì cho người ngoài (tầng 2 đã chặn họ).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Tài khoản.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
              example:
                userId: 0192f3c1-8a4e-7c31-9f2a-6b5d4e3c2a10
                email: an.nguyen@example.com
                displayName: Nguyễn Văn An
                roleCode: USER
                roleDisplayName: Người dùng
                status: active
                emailVerified: true
                lockedUntil: '2026-09-24T08:15:00Z'
                createdAt: '2026-09-08T03:10:22Z'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/RevocationUnavailable'

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT HS256 phát ở `POST /auth/login` (`identity-v1`). Claim `role` mang `roles.code`; tầng 2 tra quyền
        của vai trò đó. Lane FE: token nằm ở BFF, trình duyệt không cầm (Đ-E14).

  parameters:

    UserId:
      name: userId
      in: path
      required: true
      description: UUID của tài khoản đích. Sai dạng → 400 `errors.userId`.
      schema:
        type: string
        format: uuid

    Cursor:
      name: cursor
      in: query
      required: false
      description: '`nextCursor` của trang trước. Bỏ trống để lấy trang đầu. Cursor rác → 400 `errors.cursor`.'
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      description: Số tài khoản mỗi trang, mặc định 20, tối đa 50 (AGENTS.md Mục 9). Ngoài `1..50` → 400 `errors.limit`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20

  headers:

    XCorrelationId:
      description: |
        Correlation ID của request, bằng đúng `traceId` trong Problem Details khi có lỗi.
        Client gửi header cùng tên thì server dùng lại giá trị đó.
      schema:
        type: string
      example: 9f2c7b1e4a6d4f0b8c3e5a7d9b1f3c5e

  responses:

    ValidationProblem:
      description: |
        Dữ liệu đầu vào không hợp lệ. `errors` là map `tên trường → danh sách thông điệp`: `cursor` rác, `limit` ngoài
        `1..50`, `q` quá dài, `status`/`roleCode` sai dạng, `userId` không phải UUID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://httpstatuses.io/400
            title: Dữ liệu không hợp lệ
            status: 400
            detail: Dữ liệu đầu vào không hợp lệ
            instance: /api/v1/admin/users
            traceId: 5e7a9c1b3d5f7092a4c6e8b0d2f4a6c8
            errors:
              status:
                - Trạng thái chỉ nhận active hoặc disabled.

    Unauthorized:
      description: Thiếu access token, token sai chữ ký, hết hạn, hoặc đã bị thu hồi.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://httpstatuses.io/401
            title: Chưa xác thực
            status: 401
            detail: Yêu cầu access token hợp lệ.
            instance: /api/v1/admin/users
            traceId: a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4

    Forbidden:
      description: |
        Tầng 2 từ chối — vai trò không có mã quyền nào endpoint đòi (dòng `TC-A05` của AuthZ matrix). Để lại một dòng
        `access.denied` trong nhật ký kiểm toán (Đ-6.15). Thông điệp không nêu quyền còn thiếu.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://httpstatuses.io/403
            title: Bị từ chối
            status: 403
            detail: Bạn không có quyền thực hiện thao tác này.
            instance: /api/v1/admin/users
            traceId: c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6

    UserNotFound:
      description: Tài khoản không tồn tại.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://httpstatuses.io/404
            title: Không tìm thấy tài nguyên
            status: 404
            detail: Không tìm thấy tài khoản.
            instance: /api/v1/admin/users/0192f3c1-8a4e-7c31-9f2a-6b5d4e3c2a10
            traceId: d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0c2

    TooManyRequests:
      description: Vượt hạn mức 100 req/phút/user (ISS-04). Không có `Retry-After`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://httpstatuses.io/429
            title: Quá nhiều yêu cầu
            status: 429
            detail: Bạn đã gửi quá nhiều yêu cầu. Vui lòng thử lại sau ít phút.
            instance: /api/v1/admin/users
            traceId: e0b2d4f6a8c0e2b4d6f8a0c2e4b6d8f0

    InternalError:
      description: |
        Lỗi không mong muốn. **Không bao giờ có `detail`** — `GlobalExceptionHandler` giấu chi tiết nội bộ, chỉ
        `traceId` đi ra ngoài để đối chiếu với log.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://httpstatuses.io/500
            title: Đã xảy ra lỗi không mong muốn
            status: 500
            instance: /api/v1/admin/users
            traceId: b6d8f0a2c4e6b8d0f2a4c6e8b0d2f4a6

    RevocationUnavailable:
      description: |
        Fail-closed (Đ-6.8): server không kiểm được access token có bị thu hồi không. Không phải lỗi của phiên — FE **không**
        đăng xuất, hiện thông báo tạm thời và cho thử lại. Phân nhánh theo `type`, không theo `title`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RevocationUnavailableProblem'
          example:
            type: urn:socialapp:problem:revocation-unavailable
            title: Tạm thời không kiểm tra được phiên đăng nhập
            status: 503
            detail: Chức năng quản trị tạm thời không khả dụng. Vui lòng thử lại sau ít phút.
            instance: /api/v1/admin/users
            traceId: f8a0c2e4b6d8f0a2c4e6b8d0f2a4c6e8

  schemas:

    ProblemDetails:
      type: object
      description: |
        RFC 7807 Problem Details — dạng lỗi duy nhất của toàn dự án. Sinh bởi
        `SocialApp.SharedKernel.Errors.GlobalExceptionHandler`; `traceId` và `type` gắn thống nhất
        trong `AddSharedKernel`.
      properties:
        type:
          type: string
          format: uri
          description: Mặc định `https://httpstatuses.io/{status}`; ca FE phải phân nhánh thì là một URN ổn định.
        title:
          type: string
          description: Nhãn ngắn, ổn định theo loại lỗi. **Không** chứa dữ liệu người dùng.
        status:
          type: integer
          format: int32
        detail:
          type: string
          nullable: true
          description: Thông điệp cho người đọc. Vắng mặt ở lỗi 500.
        instance:
          type: string
          description: Path của request gây lỗi.
        traceId:
          type: string
          description: Bằng header `X-Correlation-ID` của chính request đó — dùng để tra log.
        errors:
          type: object
          nullable: true
          description: Chỉ có ở lỗi validation (400). Map `tên trường → danh sách thông điệp`.
          additionalProperties:
            type: array
            items:
              type: string
      required: [title, status, traceId]

    RevocationUnavailableProblem:
      description: 503 fail-closed của endpoint quản trị (Đ-6.8). Cùng hình dạng `ProblemDetails`, `type` cố định.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            type:
              type: string
              enum: ['urn:socialapp:problem:revocation-unavailable']
          required: [type]

    RoleCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{2,29}$'
      description: |
        `roles.code` — bất biến, cùng định nghĩa `RoleCode` của `identity-v1`. Ba vai trò hệ thống luôn có: `USER`,
        `MODERATOR`, `ADMIN`; từ GĐ6 Admin tạo được vai trò mới nên đây là chuỗi mở.
      example: USER

    UserStatus:
      type: string
      enum: [active, locked, disabled, deleted]
      description: |
        Khớp `CONSTRAINT ck_users_status` — cùng bốn giá trị với `UserStatus` của `identity-v1` (quyết định 5 của GĐ1: giữ đủ
        bốn để GĐ6/GĐ8 không mở lại hợp đồng). `disabled` = bị Admin khóa (Đ-6.5). `locked` không ai ghi; `deleted` chờ GĐ8.
        Khóa tạm do đăng nhập sai (FR-003) **không** ở đây mà ở `lockedUntil`.

    AdminUser:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: PII (Mục 8.2) — chỉ có ở nhóm `admin-v1`.
        displayName:
          type: string
          nullable: true
          description: Tên hiển thị từ hồ sơ. `null` khi người này chưa tạo hồ sơ (onboarding).
        roleCode:
          $ref: '#/components/schemas/RoleCode'
        roleDisplayName:
          type: string
          description: Tên vai trò cho người đọc (`roles.display_name`) — không dùng để so sánh logic.
          example: Người dùng
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerified:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          nullable: true
          description: |
            Khóa **tạm** do đăng nhập sai nhiều lần (FR-003) — khác `status = disabled` của Admin. Chỉ có giá trị khi mốc còn ở
            tương lai; mốc đã qua (tài khoản đã tự mở) trả `null`.
        createdAt:
          type: string
          format: date-time
      required: [userId, email, displayName, roleCode, roleDisplayName, status, emailVerified, lockedUntil, createdAt]

    AdminUserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
          description: Sắp `created_at DESC`, hòa thì `user_id DESC`.
        nextCursor:
          type: string
          nullable: true
          description: Opaque. `null` khi hết dữ liệu — không phải chuỗi rỗng.
      required: [items, nextCursor]
